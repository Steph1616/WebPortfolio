<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cinzel:wght@400..900&family=Kaushan+Script&family=Pacifico&family=Style+Script&family=Yellowtail&display=swap" rel="stylesheet">

<body>
    <!-- navbar-->
    <div class="navbar">
        <div class="logo"><span class="name-color">Steph</span> Socito</div>
        <nav>
            <a href="index.html#home">Home</a>
            <a href="about.html">About Me</a> 
            <a href="quiz.html">Quiz</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="hamburger" onclick="toggleNav()">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>

    <!-- contact section -->
    <section class="contact-section">
        <div class="contact-container">
            <h2>Get In <span class="name-color">Touch</span></h2>
            <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="97323db6-3ba1-4996-ad2d-94b707a49e7a">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
            
        </div>
    </section>

            
     <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Contact Info</h3>
                    <p><i class="fas fa-envelope"></i> socitostephano@gmail.com</p>
                    <p><i class="fas fa-phone"></i> +639541844436</p>
                </div>

                        <a href="https://www.linkedin.com/in/stephano-socito-a0b104363/"> <i class="fab fa-linkedin"> </i></a>      
                    </div>
                </div>
                <div class="footer-section">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
